<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="900" fill="#f0f0f0"/>
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Nano-Harvester Entegre Kaplama Sistemi</text>
  <text x="400" y="70" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Kesintisiz Güç Toplama Çözümü</text>

  <!-- Main Cube (Satellite) -->
  <g transform="translate(400, 350)">
    <!-- Base cube -->
    <g id="satellite-body">
      <!-- Front face -->
      <path d="M -150 -150 L 150 -150 L 150 150 L -150 150 Z" fill="#a0c8e0" stroke="#000" stroke-width="2" opacity="0.7"/>
      
      <!-- Right face -->
      <path d="M 150 -150 L 220 -220 L 220 80 L 150 150 Z" fill="#7ba7c4" stroke="#000" stroke-width="2" opacity="0.7"/>
      
      <!-- Top face -->
      <path d="M -150 -150 L 150 -150 L 220 -220 L -80 -220 Z" fill="#5885a1" stroke="#000" stroke-width="2" opacity="0.7"/>
    </g>
    
    <!-- Layer labels and markers -->
    <text x="0" y="-170" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Çok Katmanlı Nano-Harvester</text>
  </g>

  <!-- Enlarged Cross-section of Layers -->
  <g transform="translate(150, 620)">
    <rect x="0" y="0" width="500" height="200" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <text x="250" y="20" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Nano-Harvester Katman Kesiti</text>
    
    <!-- Layer 1: PV -->
    <rect x="50" y="40" width="400" height="20" fill="#ffcc99" stroke="#000" stroke-width="1"/>
    <text x="470" y="55" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Fotovoltaik Katman</text>
    <text x="470" y="70" font-family="Arial" font-size="10" text-anchor="start">PbBr₃ nanokristal, 150 µW/cm²</text>
    
    <!-- Layer 2: TE -->
    <rect x="50" y="60" width="400" height="20" fill="#ff9999" stroke="#000" stroke-width="1"/>
    <text x="470" y="90" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Termoelektrik Katman</text>
    <text x="470" y="105" font-family="Arial" font-size="10" text-anchor="start">Bi₂Te₃/Si nanowire, 30 µW/cm²</text>
    
    <!-- Layer 3: PZT -->
    <rect x="50" y="80" width="400" height="20" fill="#99ff99" stroke="#000" stroke-width="1"/>
    <text x="470" y="130" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Piezoelektrik Katman</text>
    <text x="470" y="145" font-family="Arial" font-size="10" text-anchor="start">ZnO nanowires, 3 µW/cm²</text>
    
    <!-- Layer 4: TENG -->
    <rect x="50" y="100" width="400" height="20" fill="#9999ff" stroke="#000" stroke-width="1"/>
    <text x="470" y="170" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Triboelektrik Katman</text>
    <text x="470" y="185" font-family="Arial" font-size="10" text-anchor="start">PTFE/Al, 7 µW/cm²</text>
    
    <!-- Layer 5: RF -->
    <rect x="50" y="120" width="400" height="20" fill="#cc99ff" stroke="#000" stroke-width="1"/>
    <text x="25" y="130" font-family="Arial" font-size="12" text-anchor="end" font-weight="bold">RF Harvesting</text>
    <text x="25" y="145" font-family="Arial" font-size="10" text-anchor="end">Graphene-CNT, 0.5 µW/cm²</text>
    
    <!-- Substrate -->
    <rect x="50" y="140" width="400" height="40" fill="#dddddd" stroke="#000" stroke-width="1"/>
    <text x="250" y="165" font-family="Arial" font-size="12" text-anchor="middle">Uydu Gövdesi</text>
    
    <!-- Connection traces -->
    <line x1="100" y1="140" x2="100" y2="180" stroke="#ff0000" stroke-width="2"/>
    <line x1="200" y1="140" x2="200" y2="180" stroke="#ff0000" stroke-width="2"/>
    <line x1="300" y1="140" x2="300" y2="180" stroke="#ff0000" stroke-width="2"/>
    <line x1="400" y1="140" x2="400" y2="180" stroke="#ff0000" stroke-width="2"/>
  </g>

  <!-- Power Flow Diagram -->
  <g transform="translate(50, 200)">
    <!-- Energy Sources -->
    <rect x="0" y="0" width="100" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#000" stroke-width="2"/>
    <text x="50" y="25" font-family="Arial" font-size="12" text-anchor="middle">PV Katman</text>
    
    <rect x="0" y="60" width="100" height="40" rx="5" ry="5" fill="#ff9999" stroke="#000" stroke-width="2"/>
    <text x="50" y="85" font-family="Arial" font-size="12" text-anchor="middle">TE Katman</text>
    
    <rect x="0" y="120" width="100" height="40" rx="5" ry="5" fill="#99ff99" stroke="#000" stroke-width="2"/>
    <text x="50" y="145" font-family="Arial" font-size="12" text-anchor="middle">PZT Katman</text>
    
    <rect x="0" y="180" width="100" height="40" rx="5" ry="5" fill="#9999ff" stroke="#000" stroke-width="2"/>
    <text x="50" y="205" font-family="Arial" font-size="12" text-anchor="middle">TENG Katman</text>
    
    <rect x="0" y="240" width="100" height="40" rx="5" ry="5" fill="#cc99ff" stroke="#000" stroke-width="2"/>
    <text x="50" y="265" font-family="Arial" font-size="12" text-anchor="middle">RF Katman</text>
    
    <!-- Power Management -->
    <rect x="180" y="20" width="120" height="60" rx="5" ry="5" fill="#add8e6" stroke="#000" stroke-width="2"/>
    <text x="240" y="50" font-family="Arial" font-size="12" text-anchor="middle">Micro-MPPT</text>
    <text x="240" y="65" font-family="Arial" font-size="10" text-anchor="middle">(PV/TE)</text>
    
    <rect x="180" y="120" width="120" height="60" rx="5" ry="5" fill="#add8e6" stroke="#000" stroke-width="2"/>
    <text x="240" y="150" font-family="Arial" font-size="12" text-anchor="middle">AC-DC</text>
    <text x="240" y="165" font-family="Arial" font-size="10" text-anchor="middle">(PZT/TENG/RF)</text>
    
    <rect x="180" y="210" width="120" height="40" rx="5" ry="5" fill="#c3aed6" stroke="#000" stroke-width="2"/>
    <text x="240" y="235" font-family="Arial" font-size="12" text-anchor="middle">nF Depolama</text>
    
    <!-- Main PMU -->
    <rect x="380" y="100" width="150" height="80" rx="5" ry="5" fill="#c3e6ff" stroke="#000" stroke-width="2"/>
    <text x="455" y="130" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Nano PMU</text>
    <text x="455" y="150" font-family="Arial" font-size="12" text-anchor="middle">Flyback / Boost</text>
    <text x="455" y="170" font-family="Arial" font-size="10" text-anchor="middle">Power Mixing & Regulation</text>
    
    <!-- Output Rails -->
    <rect x="600" y="80" width="120" height="40" rx="5" ry="5" fill="#e6ffcc" stroke="#000" stroke-width="2"/>
    <text x="660" y="105" font-family="Arial" font-size="12" text-anchor="middle">3.3V Rail</text>
    
    <rect x="600" y="160" width="120" height="40" rx="5" ry="5" fill="#e6ffcc" stroke="#000" stroke-width="2"/>
    <text x="660" y="185" font-family="Arial" font-size="12" text-anchor="middle">5V Rail</text>
    
    <!-- Connection lines -->
    <!-- PV to MPPT -->
    <path d="M 100 20 L 180 50" stroke="#000" stroke-width="2" fill="none"/>
    <!-- TE to MPPT -->
    <path d="M 100 80 L 180 50" stroke="#000" stroke-width="2" fill="none"/>
    <!-- PZT to AC-DC -->
    <path d="M 100 140 L 180 150" stroke="#000" stroke-width="2" fill="none"/>
    <!-- TENG to AC-DC -->
    <path d="M 100 200 L 180 150" stroke="#000" stroke-width="2" fill="none"/>
    <!-- RF to AC-DC -->
    <path d="M 100 260 L 180 150" stroke="#000" stroke-width="2" fill="none"/>
    <!-- AC-DC to Storage -->
    <path d="M 240 180 L 240 210" stroke="#000" stroke-width="2" fill="none"/>
    <!-- MPPT to PMU -->
    <path d="M 300 50 L 340 50 L 340 120 L 380 120" stroke="#000" stroke-width="2" fill="none"/>
    <!-- Storage to PMU -->
    <path d="M 300 230 L 340 230 L 340 160 L 380 160" stroke="#000" stroke-width="2" fill="none"/>
    <!-- PMU to 3.3V -->
    <path d="M 530 120 L 600 100" stroke="#000" stroke-width="2" fill="none"/>
    <!-- PMU to 5V -->
    <path d="M 530 160 L 600 180" stroke="#000" stroke-width="2" fill="none"/>
  </g>

  <!-- System Info Box -->
  <g transform="translate(50, 830)">
    <rect x="0" y="0" width="700" height="60" fill="#f8f8f8" stroke="#000" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial" font-size="14" font-weight="bold">Sistem Özellikleri:</text>
    <text x="10" y="40" font-family="Arial" font-size="12">• Toplam Kaplama Alanı: 9 cm² (3×3 cm) • Ortalama Toplam Güç: ~1.7 mW • Tamamen Pasif Toplama</text>
    <text x="10" y="55" font-family="Arial" font-size="12">• Kesintisiz Çalışma: Işık/ısı/titreşim/RF kombinasyonu • Uzay-ortam optimal • Kaplanmış PMU'ya doğrudan entegrasyon</text>
  </g>
  
  <!-- Energy Distribution Diagram -->
  <g transform="translate(580, 300)">
    <!-- Pie chart -->
    <circle cx="100" cy="100" r="80" fill="#ffffff" stroke="#000" stroke-width="2"/>
    
    <!-- PV Segment (60%) -->
    <path d="M 100 100 L 100 20 A 80 80 0 0 1 174.6 64.6 Z" fill="#ffcc99" stroke="#000" stroke-width="1"/>
    <text x="140" y="50" font-family="Arial" font-size="10" text-anchor="middle">PV: 60%</text>
    
    <!-- TE Segment (25%) -->
    <path d="M 100 100 L 174.6 64.6 A 80 80 0 0 1 174.6 135.4 Z" fill="#ff9999" stroke="#000" stroke-width="1"/>
    <text x="170" y="100" font-family="Arial" font-size="10" text-anchor="middle">TE: 25%</text>
    
    <!-- PZT Segment (5%) -->
    <path d="M 100 100 L 174.6 135.4 A 80 80 0 0 1 135.4 174.6 Z" fill="#99ff99" stroke="#000" stroke-width="1"/>
    <text x="150" y="150" font-family="Arial" font-size="10" text-anchor="middle">PZT: 5%</text>
    
    <!-- TENG Segment (8%) -->
    <path d="M 100 100 L 135.4 174.6 A 80 80 0 0 1 64.6 174.6 Z" fill="#9999ff" stroke="#000" stroke-width="1"/>
    <text x="100" y="160" font-family="Arial" font-size="10" text-anchor="middle">TENG: 8%</text>
    
    <!-- RF Segment (2%) -->
    <path d="M 100 100 L 64.6 174.6 A 80 80 0 0 1 25.4 135.4 Z" fill="#cc99ff" stroke="#000" stroke-width="1"/>
    <text x="50" y="150" font-family="Arial" font-size="10" text-anchor="middle">RF: 2%</text>
    
    <text x="100" y="200" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Enerji Dağılımı</text>
  </g>  
</svg>