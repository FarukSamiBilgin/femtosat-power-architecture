<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="800" fill="#f0f0f0"/>
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Nano Satellite PMU PCB Layout (30 × 30 mm)</text>

  <!-- PCB Outline -->
  <rect x="100" y="100" width="600" height="600" fill="#1a5c34" stroke="#000" stroke-width="3" rx="5" ry="5"/>
  
  <!-- Board reference grid (light) -->
  <g stroke="#ffffff20" stroke-width="1">
    <line x1="100" y1="150" x2="700" y2="150"/>
    <line x1="100" y1="200" x2="700" y2="200"/>
    <line x1="100" y1="250" x2="700" y2="250"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="350" x2="700" y2="350"/>
    <line x1="100" y1="400" x2="700" y2="400"/>
    <line x1="100" y1="450" x2="700" y2="450"/>
    <line x1="100" y1="500" x2="700" y2="500"/>
    <line x1="100" y1="550" x2="700" y2="550"/>
    <line x1="100" y1="600" x2="700" y2="600"/>
    <line x1="100" y1="650" x2="700" y2="650"/>
    
    <line x1="150" y1="100" x2="150" y2="700"/>
    <line x1="200" y1="100" x2="200" y2="700"/>
    <line x1="250" y1="100" x2="250" y2="700"/>
    <line x1="300" y1="100" x2="300" y2="700"/>
    <line x1="350" y1="100" x2="350" y2="700"/>
    <line x1="400" y1="100" x2="400" y2="700"/>
    <line x1="450" y1="100" x2="450" y2="700"/>
    <line x1="500" y1="100" x2="500" y2="700"/>
    <line x1="550" y1="100" x2="550" y2="700"/>
    <line x1="600" y1="100" x2="600" y2="700"/>
    <line x1="650" y1="100" x2="650" y2="700"/>
  </g>

  <!-- Connectors -->
  <!-- J1: VIN_SOLAR -->
  <rect x="150" y="130" width="80" height="40" fill="#c0c0c0" stroke="#000" stroke-width="2"/>
  <text x="190" y="155" font-family="Arial" font-size="12" text-anchor="middle">J1: VIN_SOLAR</text>
  
  <!-- J2: VIN_RTG -->
  <rect x="380" y="130" width="80" height="40" fill="#c0c0c0" stroke="#000" stroke-width="2"/>
  <text x="420" y="155" font-family="Arial" font-size="12" text-anchor="middle">J2: VIN_RTG</text>
  
  <!-- Test Points -->
  <!-- TP1: GND -->
  <circle cx="630" cy="150" r="15" fill="#a0a0a0" stroke="#000" stroke-width="2"/>
  <text x="630" y="155" font-family="Arial" font-size="10" text-anchor="middle">TP1: GND</text>
  
  <!-- TP2: V3.3 -->
  <circle cx="630" cy="450" r="15" fill="#a0a0a0" stroke="#000" stroke-width="2"/>
  <text x="630" y="455" font-family="Arial" font-size="10" text-anchor="middle">TP2: V3.3</text>
  
  <!-- TP3: V5 -->
  <circle cx="180" cy="550" r="15" fill="#a0a0a0" stroke="#000" stroke-width="2"/>
  <text x="180" y="555" font-family="Arial" font-size="10" text-anchor="middle">TP3: V5</text>

  <!-- Flyback Section -->
  <!-- U1: Flyback IC -->
  <rect x="150" y="200" width="120" height="80" fill="#add8e6" stroke="#000" stroke-width="2"/>
  <text x="210" y="245" font-family="Arial" font-size="12" text-anchor="middle">U1: Flyback IC</text>
  
  <!-- L1: Flyback Coil -->
  <ellipse cx="480" cy="240" rx="70" ry="40" fill="#e6c3ad" stroke="#000" stroke-width="2"/>
  <text x="480" y="245" font-family="Arial" font-size="12" text-anchor="middle">L1: Flyback Coil</text>
  
  <!-- D1: Schottky -->
  <rect x="150" y="300" width="120" height="60" fill="#fff7ad" stroke="#000" stroke-width="2"/>
  <text x="210" y="335" font-family="Arial" font-size="12" text-anchor="middle">D1: Schottky</text>
  
  <!-- C1: Cout_3.3V -->
  <rect x="480" y="300" width="120" height="60" fill="#bde4a8" stroke="#000" stroke-width="2"/>
  <text x="540" y="335" font-family="Arial" font-size="12" text-anchor="middle">C1: Cout_3.3V</text>

  <!-- Boost Section -->
  <!-- U2: Boost IC -->
  <rect x="150" y="380" width="120" height="80" fill="#add8e6" stroke="#000" stroke-width="2"/>
  <text x="210" y="425" font-family="Arial" font-size="12" text-anchor="middle">U2: Boost IC</text>
  
  <!-- L2: Boost Coil -->
  <ellipse cx="480" cy="420" rx="70" ry="40" fill="#e6c3ad" stroke="#000" stroke-width="2"/>
  <text x="480" y="425" font-family="Arial" font-size="12" text-anchor="middle">L2: Boost Coil</text>
  
  <!-- D2: Schottky -->
  <rect x="150" y="480" width="120" height="60" fill="#fff7ad" stroke="#000" stroke-width="2"/>
  <text x="210" y="515" font-family="Arial" font-size="12" text-anchor="middle">D2: Schottky</text>
  
  <!-- C2: Cout_5V -->
  <rect x="480" y="480" width="120" height="60" fill="#bde4a8" stroke="#000" stroke-width="2"/>
  <text x="540" y="515" font-family="Arial" font-size="12" text-anchor="middle">C2: Cout_5V</text>

  <!-- MCU & Capacitors -->
  <!-- U3: MCU (Energy Manager) -->
  <rect x="150" y="580" width="220" height="80" fill="#c3aed6" stroke="#000" stroke-width="2"/>
  <text x="260" y="625" font-family="Arial" font-size="12" text-anchor="middle">U3: MCU (Energy Manager)</text>
  
  <!-- C3: Cin3V -->
  <rect x="380" y="580" width="80" height="60" fill="#bde4a8" stroke="#000" stroke-width="2"/>
  <text x="420" y="615" font-family="Arial" font-size="12" text-anchor="middle">C3: Cin3V</text>
  
  <!-- C4: Cin5V -->
  <rect x="500" y="580" width="80" height="60" fill="#bde4a8" stroke="#000" stroke-width="2"/>
  <text x="540" y="615" font-family="Arial" font-size="12" text-anchor="middle">C4: Cin5V</text>

  <!-- Component Traces -->
  <!-- High-current traces -->
  <g stroke="#ffb900" stroke-width="4" fill="none">
    <!-- Solar to Boost -->
    <path d="M 190 170 L 190 380"/>
    <!-- RTG to Flyback -->
    <path d="M 420 170 L 420 200 L 270 200"/>
    <!-- Flyback to 3.3V -->
    <path d="M 270 240 L 410 240"/>
    <path d="M 550 240 L 600 240 L 600 450 L 615 450"/>
    <!-- Boost to 5V -->
    <path d="M 270 420 L 410 420"/>
    <path d="M 550 420 L 600 420 L 600 550 L 195 550"/>
  </g>
  
  <!-- Signal traces -->
  <g stroke="#4c9be8" stroke-width="2" fill="none">
    <!-- MCU control signals -->
    <path d="M 200 580 L 200 460"/>
    <path d="M 240 580 L 240 370"/>
    <path d="M 480 350 L 400 350 L 400 520 L 270 520"/>
    <path d="M 480 520 L 420 520 L 420 580"/>
  </g>
  
  <!-- GND connections -->
  <g stroke="#808080" stroke-width="2" fill="none">
    <path d="M 630 165 L 630 200 L 580 200 L 580 300"/>
    <path d="M 630 200 L 680 200 L 680 650 L 120 650 L 120 580 L 150 580"/>
    <path d="M 120 300 L 150 300"/>
    <path d="M 120 480 L 150 480"/>
  </g>

  <!-- Via indicators -->
  <g fill="#ff0000" stroke="#000" stroke-width="1">
    <circle cx="190" cy="380" r="5"/>
    <circle cx="270" cy="200" r="5"/>
    <circle cx="410" cy="240" r="5"/>
    <circle cx="600" cy="450" r="5"/>
    <circle cx="410" cy="420" r="5"/>
    <circle cx="195" cy="550" r="5"/>
    <circle cx="200" cy="460" r="5"/>
    <circle cx="240" cy="370" r="5"/>
    <circle cx="270" cy="520" r="5"/>
    <circle cx="420" cy="580" r="5"/>
    <circle cx="580" cy="300" r="5"/>
    <circle cx="120" cy="580" r="5"/>
    <circle cx="120" cy="300" r="5"/>
    <circle cx="120" cy="480" r="5"/>
  </g>

  <!-- Component Orientation Marks -->
  <g fill="#ffffff" stroke="#000" stroke-width="1">
    <circle cx="160" cy="210" r="5"/>
    <circle cx="160" cy="390" r="5"/>
    <circle cx="160" cy="310" r="5"/>
    <circle cx="160" cy="490" r="5"/>
    <circle cx="160" cy="590" r="5"/>
  </g>

  <!-- Board Info -->
  <g>
    <rect x="100" y="720" width="600" height="60" fill="#f0f0f0" stroke="#000" stroke-width="1"/>
    <text x="400" y="740" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PCB Design Notes</text>
    <text x="120" y="760" font-family="Arial" font-size="12">• Board Size: 30 × 30 mm, 2-layer, FR-4, 1 oz copper</text>
    <text x="450" y="760" font-family="Arial" font-size="12">• Optimized for minimum EMI and micro thermal control</text>
    <text x="120" y="775" font-family="Arial" font-size="12">• High-current paths minimized • Strategic via placement • Ground plane on bottom layer</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="620" y="650" width="20" height="10" fill="#ffb900" stroke="#000" stroke-width="1"/>
    <text x="650" y="658" font-family="Arial" font-size="10" text-anchor="left">High-current trace</text>
    
    <rect x="620" y="665" width="20" height="10" fill="#4c9be8" stroke="#000" stroke-width="1"/>
    <text x="650" y="673" font-family="Arial" font-size="10" text-anchor="left">Signal trace</text>
    
    <rect x="620" y="680" width="20" height="10" fill="#808080" stroke="#000" stroke-width="1"/>
    <text x="650" y="688" font-family="Arial" font-size="10" text-anchor="left">GND connection</text>
    
    <circle cx="630" cy="700" r="5" fill="#ff0000" stroke="#000" stroke-width="1"/>
    <text x="650" y="703" font-family="Arial" font-size="10" text-anchor="left">Via</text>
  </g>
</svg>