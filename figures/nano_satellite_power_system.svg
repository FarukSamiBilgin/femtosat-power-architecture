<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9"/>
  <text x="400" y="30" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Nano-Satellite Optimized Power Management System</text>

  <!-- Power Sources -->
  <g>
    <!-- Solar Panel Box -->
    <rect x="50" y="80" width="120" height="70" fill="#ffe9c3" stroke="#000" stroke-width="2"/>
    <text x="110" y="110" font-family="Arial" font-size="14" text-anchor="middle">Solar Panel</text>
    <text x="110" y="130" font-family="Arial" font-size="12" text-anchor="middle">≈3V Output</text>
    
    <!-- RTG Box -->
    <rect x="50" y="180" width="120" height="70" fill="#ffd1d1" stroke="#000" stroke-width="2"/>
    <text x="110" y="210" font-family="Arial" font-size="14" text-anchor="middle">RTG</text>
    <text x="110" y="230" font-family="Arial" font-size="12" text-anchor="middle">12V Output</text>
    
    <!-- Supercapacitor Box -->
    <rect x="50" y="280" width="120" height="70" fill="#d1e7ff" stroke="#000" stroke-width="2"/>
    <text x="110" y="310" font-family="Arial" font-size="14" text-anchor="middle">Supercapacitors</text>
    <text x="110" y="330" font-family="Arial" font-size="12" text-anchor="middle">Backup Power</text>
  </g>

  <!-- Power Management Unit (Center) -->
  <g>
    <rect x="280" y="150" width="240" height="240" fill="#e6ffe6" stroke="#000" stroke-width="2"/>
    <text x="400" y="170" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Power Management Unit</text>
    
    <!-- Temperature Compensation Module -->
    <rect x="300" y="190" width="200" height="40" fill="#ccffcc" stroke="#000" stroke-width="1"/>
    <text x="400" y="215" font-family="Arial" font-size="12" text-anchor="middle">Temperature Compensation</text>
    <text x="400" y="230" font-family="Arial" font-size="10" text-anchor="middle">-50°C to +80°C Stability</text>
    
    <!-- Converters -->
    <rect x="300" y="240" width="90" height="60" fill="#c3e6ff" stroke="#000" stroke-width="1"/>
    <text x="345" y="260" font-family="Arial" font-size="11" text-anchor="middle">Nano Flyback</text>
    <text x="345" y="275" font-family="Arial" font-size="10" text-anchor="middle">12V→3.3V/5V</text>
    <text x="345" y="290" font-family="Arial" font-size="9" text-anchor="middle">(ZVS Enabled)</text>
    
    <rect x="410" y="240" width="90" height="60" fill="#c3e6ff" stroke="#000" stroke-width="1"/>
    <text x="455" y="260" font-family="Arial" font-size="11" text-anchor="middle">Nano Boost 1</text>
    <text x="455" y="275" font-family="Arial" font-size="10" text-anchor="middle">3V→5V</text>
    <text x="455" y="290" font-family="Arial" font-size="9" text-anchor="middle">(Task-based)</text>
    
    <!-- Dynamic Power Priority Controller -->
    <rect x="300" y="310" width="200" height="50" fill="#ffe6cc" stroke="#000" stroke-width="1"/>
    <text x="400" y="330" font-family="Arial" font-size="12" text-anchor="middle">Dynamic Power Priority Controller</text>
    <text x="400" y="345" font-family="Arial" font-size="10" text-anchor="middle">Adaptive Frequency &amp; PWM Control</text>
  </g>

  <!-- Fault Tolerant Architecture -->
  <g>
    <rect x="280" y="400" width="240" height="60" fill="#ffd6cc" stroke="#000" stroke-width="2"/>
    <text x="400" y="425" font-family="Arial" font-size="14" text-anchor="middle">Fault Tolerant Architecture</text>
    <text x="400" y="445" font-family="Arial" font-size="10" text-anchor="middle">Redundant Paths &amp; Auto-Failover</text>
  </g>

  <!-- Voltage Rails and Outputs -->
  <g>
    <rect x="600" y="120" width="150" height="70" fill="#e6ccff" stroke="#000" stroke-width="2"/>
    <text x="675" y="145" font-family="Arial" font-size="14" text-anchor="middle">1.8V Rail</text>
    <text x="675" y="165" font-family="Arial" font-size="12" text-anchor="middle">Low-power Sensors</text>
    <text x="675" y="180" font-family="Arial" font-size="10" text-anchor="middle">(0.1-0.2 mW)</text>
    
    <rect x="600" y="210" width="150" height="70" fill="#e6ccff" stroke="#000" stroke-width="2"/>
    <text x="675" y="235" font-family="Arial" font-size="14" text-anchor="middle">3.3V Rail</text>
    <text x="675" y="255" font-family="Arial" font-size="12" text-anchor="middle">MCU &amp; EEPROM</text>
    <text x="675" y="270" font-family="Arial" font-size="10" text-anchor="middle">(≈1.1 mW)</text>
    
    <rect x="600" y="300" width="150" height="70" fill="#e6ccff" stroke="#000" stroke-width="2"/>
    <text x="675" y="325" font-family="Arial" font-size="14" text-anchor="middle">5V Rail</text>
    <text x="675" y="345" font-family="Arial" font-size="12" text-anchor="middle">Laser Comm &amp; Camera</text>
    <text x="675" y="360" font-family="Arial" font-size="10" text-anchor="middle">(10-20 mW)</text>
  </g>

  <!-- Connection Lines -->
  <!-- Solar to PMU -->
  <path d="M 170 115 L 225 115 L 225 220 L 280 220" stroke="#000" stroke-width="1.5" fill="none"/>
  <!-- RTG to PMU -->
  <path d="M 170 215 L 280 215" stroke="#000" stroke-width="1.5" fill="none"/>
  <!-- Supercap to PMU -->
  <path d="M 170 315 L 225 315 L 225 250 L 280 250" stroke="#000" stroke-width="1.5" fill="none"/>
  
  <!-- PMU to Outputs -->
  <path d="M 520 155 L 560 155 L 560 155 L 600 155" stroke="#000" stroke-width="1.5" fill="none"/>
  <path d="M 520 245 L 600 245" stroke="#000" stroke-width="1.5" fill="none"/>
  <path d="M 520 335 L 560 335 L 560 335 L 600 335" stroke="#000" stroke-width="1.5" fill="none"/>
  
  <!-- PMU to Fault Tolerant -->
  <path d="M 400 390 L 400 400" stroke="#000" stroke-width="1.5" fill="none"/>

  <!-- Efficiency Indicators -->
  <g>
    <rect x="50" y="480" width="700" height="80" fill="#f0f0f0" stroke="#000" stroke-width="1"/>
    <text x="400" y="500" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">System Performance Optimizations</text>
    
    <text x="100" y="525" font-family="Arial" font-size="12">• ZVS/ZCS: ↓80% Switching Losses</text>
    <text x="100" y="545" font-family="Arial" font-size="12">• Adaptive Freq: Dynamic 85-92% Efficiency</text>
    
    <text x="350" y="525" font-family="Arial" font-size="12">• Multi-Rail: Optimized Load Matching</text>
    <text x="350" y="545" font-family="Arial" font-size="12">• Temp Comp: Stable -50°C to +80°C</text>
    
    <text x="600" y="525" font-family="Arial" font-size="12">• Dynamic Priority: RTG Lifetime +25%</text>
    <text x="600" y="545" font-family="Arial" font-size="12">• Fault Tolerance: Auto-recovery <5ms</text>
  </g>

  <!-- Nano Boost 2 (Backup) -->
  <rect x="300" y="360" width="90" height="40" fill="#c3e6ff" stroke="#000" stroke-width="1"/>
  <text x="345" y="380" font-family="Arial" font-size="11" text-anchor="middle">Nano Boost 2</text>
  <text x="345" y="395" font-family="Arial" font-size="9" text-anchor="middle">(Cold Start)</text>
  
  <rect x="410" y="360" width="90" height="40" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
  <text x="455" y="380" font-family="Arial" font-size="11" text-anchor="middle">State Machine</text>
  <text x="455" y="395" font-family="Arial" font-size="9" text-anchor="middle">(Mode Switching)</text>
</svg>